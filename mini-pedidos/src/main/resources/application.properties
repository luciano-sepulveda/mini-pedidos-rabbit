
# ==========================================
# MINI PEDIDOS - CONFIGURACION GENERAL
# ==========================================
spring.application.name=mini-pedidos

# ==========================================
# RABBITMQ - CONEXION
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# RABBITMQ - ACK MANUAL
# ==========================================
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# ==========================================
# SQS / ELASTICMQ
# ==========================================
sqs.endpoint=${SQS_ENDPOINT:http://localhost:9324}
sqs.queue-url=${SQS_QUEUE_URL:http://localhost:9324/000000000000/pedidos-mini}

# ==========================================
# RABBITMQ - NOMBRES CENTRALIZADOS
# ==========================================
rabbitmq.exchange.pedidos=pedidos.exchange
rabbitmq.queue.pedidos=pedidos
rabbitmq.routing-key.pedidos=pedidos.nuevo
rabbitmq.exchange.dlx=pedidos.dlx
rabbitmq.queue.dlq=pedidos.dlq
rabbitmq.routing-key.dlq=pedidos.error
